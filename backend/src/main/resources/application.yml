# Application Configuration
# PlacementPro: AI-Assisted Campus Placement System

spring:
  application:
    name: campus-placement-system

  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/campus_placement?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: # TODO: Configure database password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# AI Service Configuration
# The AI module acts strictly as a decision-support system
ai-service:
  base-url: http://localhost:8000/api/v1
  timeout: 30000

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging Configuration
logging:
  level:
    com.campusplacement: DEBUG
    org.springframework.security: DEBUG
