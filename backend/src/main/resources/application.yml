# Application Configuration
# PlacementPro: AI-Assisted Campus Placement System

spring:
  application:
    name: campus-placement-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]

  # Database Configuration - PostgreSQL/Supabase
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campus_placement}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # SQL Script Initialization
  sql:
    init:
      mode: always
      separator: ;;
      schema-locations: classpath:schema.sql
      data-locations: classpath:seed-data-v2.sql
      continue-on-error: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVerySecureSecretKeyForJWTTokenGenerationMinimum256BitsLong}
    issuer: ${JWT_ISSUER:PlacementPro}
    audience: ${JWT_AUDIENCE:PlacementPro-App}
    access-expiration-ms: 900000  # 15 minutes
    refresh-expiration-days: 7  # 7 days
  audit:
    retention-days: 90  # Keep audit logs for 90 days
    cleanup-enabled: true  # Enable scheduled cleanup
    cleanup-cron: "0 0 2 * * ?"  # Run daily at 2 AM
  cookie:
    secure: ${COOKIE_SECURE:false}  # Set to true in production (HTTPS)
    domain: ${COOKIE_DOMAIN:}  # Leave empty for localhost
  auth:
    session:
      max-concurrent-sessions: 5  # Limit active devices per user
      idle-timeout-minutes: 30    # Auto-logout after 30 mins of inactivity (during refresh)

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: campus-placement-system
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      aiService:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  ratelimiter:
    instances:
      aiService:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  timelimiter:
    instances:
      aiService:
        timeoutDuration: 3s

# AI Service Configuration
# The AI module acts strictly as a decision-support system
ai-service:
  base-url: http://localhost:8000/api/v1
  timeout: 30000

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging Configuration
logging:
  level:
    com.campusplacement: DEBUG
    org.springframework.security: DEBUG
