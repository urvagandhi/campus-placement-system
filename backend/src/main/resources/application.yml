# Application Configuration
# PlacementPro: AI-Assisted Campus Placement System

spring:
  application:
    name: campus-placement-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]

  # Database Configuration - PostgreSQL/Supabase
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campus_placement}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: false
  sql:
    init:
      mode: always
      separator: ;;
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVerySecureSecretKeyForJWTTokenGenerationMinimum256BitsLong}
    expiration-ms: 86400000  # 24 hours

# AI Service Configuration
# The AI module acts strictly as a decision-support system
ai-service:
  base-url: http://localhost:8000/api/v1
  timeout: 30000

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging Configuration
logging:
  level:
    com.campusplacement: DEBUG
    org.springframework.security: DEBUG
